<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#2196F3"/>
    </linearGradient>
  </defs>
  <rect width="360" height="720" rx="28" fill="#F5F7FA"/>

  <rect width="360" height="24" fill="#1976D2"/>
  <text x="16" y="17" fill="#ffffff" font-size="11" font-weight="600">9:41</text>
  <g transform="translate(316 9)" fill="#ffffff">
    <rect width="14" height="8" rx="1.5"/><rect x="18" y="2" width="20" height="4" rx="1"/>
  </g>

  <rect y="24" width="360" height="68" fill="url(#header)"/>
  <path d="M22 60 l-10 -10 l10 -10" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="42" y="65" fill="#ffffff" font-size="16" font-weight="700">Reserve a Lab Test</text>

  <!-- stepper -->
  <g transform="translate(20 108)">
    <line x1="14" y1="14" x2="306" y2="14" stroke="#CFD8DC" stroke-width="2"/>
    <line x1="14" y1="14" x2="160" y2="14" stroke="#2196F3" stroke-width="2"/>
    <g><circle cx="14" cy="14" r="12" fill="#2196F3"/><text x="14" y="18" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">✓</text></g>
    <g><circle cx="160" cy="14" r="12" fill="#2196F3"/><text x="160" y="18" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">2</text></g>
    <g><circle cx="306" cy="14" r="12" fill="#ffffff" stroke="#CFD8DC" stroke-width="2"/><text x="306" y="18" fill="#90A4AE" font-size="10" font-weight="700" text-anchor="middle">3</text></g>
    <text x="14" y="44" fill="#0F2742" font-size="9" font-weight="600" text-anchor="middle">Test</text>
    <text x="160" y="44" fill="#0F2742" font-size="9" font-weight="600" text-anchor="middle">Schedule</text>
    <text x="306" y="44" fill="#7A8A99" font-size="9" font-weight="600" text-anchor="middle">Confirm</text>
  </g>

  <!-- selected test card -->
  <g transform="translate(16 176)">
    <rect width="328" height="84" rx="16" fill="#ffffff" stroke="#E3E8EF"/>
    <g transform="translate(16 18)">
      <rect width="50" height="50" rx="14" fill="#E3F2FD"/>
      <g transform="translate(16 8)" fill="#1976D2">
        <rect x="6" y="0" width="6" height="4" rx="1"/>
        <path d="M2 6 L16 6 L19 30 Q19 36 13 36 L5 36 Q-1 36 -1 30 Z"/>
        <rect x="0" y="24" width="18" height="6" fill="#90CAF9"/>
      </g>
    </g>
    <text x="80" y="38" fill="#0F2742" font-size="13" font-weight="700">Complete Blood Count (CBC)</text>
    <text x="80" y="56" fill="#7A8A99" font-size="10">El Borg Laboratories · Fasting required</text>
    <g transform="translate(80 64)">
      <rect width="60" height="18" rx="9" fill="#E8F5E9"/>
      <text x="9" y="13" fill="#2E7D32" font-size="9" font-weight="700">Most popular</text>
    </g>
    <text x="276" y="36" fill="#1976D2" font-size="14" font-weight="800">120 EGP</text>
  </g>

  <!-- collection method -->
  <text x="20" y="288" fill="#0F2742" font-size="13" font-weight="700">Collection method</text>
  <g transform="translate(16 300)">
    <rect width="156" height="80" rx="14" fill="#2196F3"/>
    <g transform="translate(14 14)" fill="#ffffff">
      <rect width="28" height="22" rx="3"/>
      <path d="M0 6 L14 -2 L28 6" fill="#ffffff"/>
      <rect x="10" y="10" width="8" height="12" fill="#2196F3"/>
    </g>
    <text x="14" y="60" fill="#ffffff" font-size="12" font-weight="700">Home collection</text>
    <text x="14" y="74" fill="#BBDEFB" font-size="9">Nurse at your door</text>
    <circle cx="140" cy="14" r="8" fill="#ffffff"/>
    <path d="M136 14 l3 3 l5 -6" stroke="#2196F3" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(188 300)">
    <rect width="156" height="80" rx="14" fill="#ffffff" stroke="#E3E8EF"/>
    <g transform="translate(14 14)" fill="#1976D2">
      <rect width="28" height="24" rx="3"/>
      <rect x="4" y="4" width="6" height="6" fill="#ffffff"/>
      <rect x="14" y="4" width="6" height="6" fill="#ffffff"/>
      <rect x="4" y="14" width="20" height="4" fill="#ffffff"/>
    </g>
    <text x="14" y="60" fill="#0F2742" font-size="12" font-weight="700">Visit lab</text>
    <text x="14" y="74" fill="#7A8A99" font-size="9">Walk-in or appointment</text>
  </g>

  <!-- date picker -->
  <text x="20" y="408" fill="#0F2742" font-size="13" font-weight="700">Pick a date</text>
  <g transform="translate(16 420)" font-size="11" font-weight="600">
    <g><rect width="62" height="76" rx="14" fill="#ffffff" stroke="#E3E8EF"/>
      <text x="31" y="22" text-anchor="middle" fill="#7A8A99" font-size="10">Wed</text>
      <text x="31" y="46" text-anchor="middle" fill="#0F2742" font-size="20" font-weight="800">7</text>
      <text x="31" y="64" text-anchor="middle" fill="#7A8A99" font-size="9">May</text>
    </g>
    <g transform="translate(72 0)"><rect width="62" height="76" rx="14" fill="#2196F3"/>
      <text x="31" y="22" text-anchor="middle" fill="#BBDEFB" font-size="10">Thu</text>
      <text x="31" y="46" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">8</text>
      <text x="31" y="64" text-anchor="middle" fill="#BBDEFB" font-size="9">May</text>
    </g>
    <g transform="translate(144 0)"><rect width="62" height="76" rx="14" fill="#ffffff" stroke="#E3E8EF"/>
      <text x="31" y="22" text-anchor="middle" fill="#7A8A99" font-size="10">Fri</text>
      <text x="31" y="46" text-anchor="middle" fill="#0F2742" font-size="20" font-weight="800">9</text>
      <text x="31" y="64" text-anchor="middle" fill="#7A8A99" font-size="9">May</text>
    </g>
    <g transform="translate(216 0)"><rect width="62" height="76" rx="14" fill="#ffffff" stroke="#E3E8EF"/>
      <text x="31" y="22" text-anchor="middle" fill="#7A8A99" font-size="10">Sat</text>
      <text x="31" y="46" text-anchor="middle" fill="#0F2742" font-size="20" font-weight="800">10</text>
      <text x="31" y="64" text-anchor="middle" fill="#7A8A99" font-size="9">May</text>
    </g>
  </g>

  <!-- time slots -->
  <text x="20" y="540" fill="#0F2742" font-size="13" font-weight="700">Time slot</text>
  <g transform="translate(16 552)" font-size="11" font-weight="600">
    <g><rect width="76" height="36" rx="12" fill="#ffffff" stroke="#E3E8EF"/><text x="38" y="23" text-anchor="middle" fill="#0F2742">07:00</text></g>
    <g transform="translate(84 0)"><rect width="76" height="36" rx="12" fill="#2196F3"/><text x="38" y="23" text-anchor="middle" fill="#ffffff">08:30</text></g>
    <g transform="translate(168 0)"><rect width="76" height="36" rx="12" fill="#ffffff" stroke="#E3E8EF"/><text x="38" y="23" text-anchor="middle" fill="#0F2742">10:00</text></g>
    <g transform="translate(252 0)"><rect width="76" height="36" rx="12" fill="#ffffff" stroke="#E3E8EF"/><text x="38" y="23" text-anchor="middle" fill="#7A8A99" text-decoration="line-through">11:30</text></g>
  </g>

  <!-- summary + cta -->
  <g transform="translate(16 612)">
    <rect width="328" height="92" rx="18" fill="#ffffff" stroke="#E3E8EF"/>
    <text x="16" y="26" fill="#7A8A99" font-size="10">Total · home collection included</text>
    <text x="16" y="52" fill="#0F2742" font-size="20" font-weight="800">120 EGP</text>
    <text x="16" y="74" fill="#43A047" font-size="10" font-weight="600">✓ Results in 24 hours</text>
    <g transform="translate(186 22)">
      <rect width="124" height="50" rx="14" fill="#1976D2"/>
      <text x="62" y="30" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Confirm booking</text>
    </g>
  </g>
</svg>
