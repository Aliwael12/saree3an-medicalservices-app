<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="55%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#00BCD4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- pulse rings -->
  <g transform="translate(950 180)" fill="none" stroke="#ffffff" stroke-opacity="0.18">
    <circle r="60"/>
    <circle r="110"/>
    <circle r="170"/>
    <circle r="240"/>
  </g>

  <!-- cross logo -->
  <g transform="translate(80 110)">
    <rect width="120" height="120" rx="28" fill="#ffffff"/>
    <rect x="50" y="20" width="20" height="80" rx="6" fill="#2196F3"/>
    <rect x="20" y="50" width="80" height="20" rx="6" fill="#2196F3"/>
  </g>

  <!-- title -->
  <text x="240" y="160" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="-1">Saree3an Medical</text>
  <text x="240" y="205" fill="#E3F2FD" font-size="22" font-weight="500">Lab Tests · Ambulance · Doctors · Medical History</text>

  <!-- chips -->
  <g font-size="14" font-weight="600" fill="#ffffff">
    <g transform="translate(240 240)">
      <rect width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.4"/>
      <text x="20" y="22">Flutter</text>
      <circle cx="100" cy="17" r="5" fill="#64FFDA"/>
    </g>
    <g transform="translate(370 240)">
      <rect width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.4"/>
      <text x="20" y="22">Firebase</text>
      <circle cx="100" cy="17" r="5" fill="#FFD54F"/>
    </g>
    <g transform="translate(500 240)">
      <rect width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.4"/>
      <text x="20" y="22">Realtime GPS</text>
      <circle cx="140" cy="17" r="5" fill="#FF8A65"/>
    </g>
    <g transform="translate(670 240)">
      <rect width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.4"/>
      <text x="20" y="22">Cross-platform</text>
      <circle cx="140" cy="17" r="5" fill="#80DEEA"/>
    </g>
  </g>

  <!-- ECG line -->
  <path d="M0 320 L200 320 L240 320 L260 290 L280 340 L300 260 L320 360 L340 320 L600 320 L640 320 L660 295 L680 340 L700 270 L720 355 L740 320 L1200 320"
        fill="none" stroke="#64FFDA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
