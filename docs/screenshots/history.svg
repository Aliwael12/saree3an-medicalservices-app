  <!-- export -->
  <g transform="translate(16 676)">
    <rect width="328" height="40" rx="14" fill="#0F2742"/>
    <text x="164" y="26" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Export full medical record (PDF)</text>
  </g>
