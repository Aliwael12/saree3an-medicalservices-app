<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#2196F3"/>
    </linearGradient>
  </defs>
  <rect width="360" height="720" rx="28" fill="#F5F7FA"/>

  <rect width="360" height="24" fill="#1976D2"/>
  <text x="16" y="17" fill="#ffffff" font-size="11" font-weight="600">9:41</text>

  <rect y="24" width="360" height="60" fill="url(#hdr)"/>
  <path d="M22 56 l-10 -10 l10 -10" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="42" y="60" fill="#ffffff" font-size="15" font-weight="700">Medical History</text>
  <g transform="translate(312 38)">
    <rect width="32" height="22" rx="6" fill="#ffffff" fill-opacity="0.18"/>
    <path d="M8 11 h16 M8 16 h12" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- summary cards -->
  <g transform="translate(16 100)">
    <rect width="100" height="74" rx="16" fill="#E3F2FD"/>
    <text x="14" y="28" fill="#1976D2" font-size="22" font-weight="800">14</text>
    <text x="14" y="48" fill="#1976D2" font-size="10" font-weight="600">Lab tests</text>
    <text x="14" y="62" fill="#1976D2" font-size="9" opacity="0.7">Last: yesterday</text>
  </g>
  <g transform="translate(130 100)">
    <rect width="100" height="74" rx="16" fill="#E0F2F1"/>
    <text x="14" y="28" fill="#00695C" font-size="22" font-weight="800">9</text>
    <text x="14" y="48" fill="#00695C" font-size="10" font-weight="600">Visits</text>
    <text x="14" y="62" fill="#00695C" font-size="9" opacity="0.7">3 this month</text>
  </g>
  <g transform="translate(244 100)">
    <rect width="100" height="74" rx="16" fill="#FFEBEE"/>
    <text x="14" y="28" fill="#C62828" font-size="22" font-weight="800">2</text>
    <text x="14" y="48" fill="#C62828" font-size="10" font-weight="600">Ambulance</text>
    <text x="14" y="62" fill="#C62828" font-size="9" opacity="0.7">All resolved</text>
  </g>

  <!-- mini chart -->
  <g transform="translate(16 192)">
    <rect width="328" height="120" rx="18" fill="#ffffff" stroke="#E3E8EF"/>
