          <text x="29" y="11" text-anchor="middle" fill="#2E7D32" font-size="8" font-weight="800">PDF READY</text>
        </g>
      </g>
    </g>

    <!-- entry 2 -->
    <g transform="translate(0 96)">
      <circle cx="14" cy="20" r="11" fill="#E0F2F1"/>
      <path d="M14 14 v12 M8 20 h12" stroke="#00695C" stroke-width="2" stroke-linecap="round"/>
      <g transform="translate(40 0)">
        <rect width="284" height="74" rx="14" fill="#ffffff" stroke="#E3E8EF"/>
        <text x="14" y="22" fill="#7A8A99" font-size="9" font-weight="600">APR 28 · 16:00</text>
        <text x="14" y="40" fill="#0F2742" font-size="12" font-weight="700">Dr. Nour · Cardiology</text>
        <text x="14" y="56" fill="#7A8A99" font-size="10">Follow-up · Prescription added</text>
        <g transform="translate(14 60)">
          <rect width="60" height="14" rx="7" fill="#E3F2FD"/>
          <text x="30" y="11" text-anchor="middle" fill="#1976D2" font-size="8" font-weight="800">RX ADDED</text>
        </g>
      </g>
    </g>

    <!-- entry 3 -->
    <g transform="translate(0 192)">
      <circle cx="14" cy="20" r="11" fill="#FFEBEE"/>
      <rect x="8" y="16" width="12" height="8" rx="1.5" fill="#C62828"/>
      <rect x="13" y="14" width="2" height="12" fill="#C62828"/>
      <rect x="11" y="18" width="6" height="2" fill="#ffffff"/>
      <g transform="translate(40 0)">
        <rect width="284" height="74" rx="14" fill="#ffffff" stroke="#E3E8EF"/>
        <text x="14" y="22" fill="#7A8A99" font-size="9" font-weight="600">APR 12 · 23:14</text>
        <text x="14" y="40" fill="#0F2742" font-size="12" font-weight="700">Ambulance · As-Salam ER</text>
        <text x="14" y="56" fill="#7A8A99" font-size="10">Resolved · 18 min trip</text>
        <g transform="translate(14 60)">
          <rect width="64" height="14" rx="7" fill="#E8F5E9"/>
          <text x="32" y="11" text-anchor="middle" fill="#2E7D32" font-size="8" font-weight="800">RESOLVED</text>
        </g>
