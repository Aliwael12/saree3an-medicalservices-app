  <g transform="translate(20 376)">
    <line x1="14" y1="0" x2="14" y2="296" stroke="#E3E8EF" stroke-width="2"/>

    <!-- entry 1 -->
    <g>
      <circle cx="14" cy="20" r="11" fill="#E3F2FD"/>
      <rect x="9" y="15" width="10" height="10" rx="2" fill="#1976D2"/>
      <g transform="translate(40 0)">
        <rect width="284" height="74" rx="14" fill="#ffffff" stroke="#E3E8EF"/>
        <text x="14" y="22" fill="#7A8A99" font-size="9" font-weight="600">MAY 6 · 09:30</text>
        <text x="14" y="40" fill="#0F2742" font-size="12" font-weight="700">CBC · El Borg Lab</text>
        <text x="14" y="56" fill="#7A8A99" font-size="10">Home collection · Results ready</text>
        <g transform="translate(14 60)">
