      <line x1="0" y1="20" x2="290" y2="20" stroke="#ECEFF1"/>
      <line x1="0" y1="0" x2="290" y2="0" stroke="#ECEFF1"/>
      <!-- bars -->
      <g fill="#2196F3">
        <rect x="6"   y="22" width="20" height="18" rx="3"/>
        <rect x="54"  y="14" width="20" height="26" rx="3"/>
        <rect x="102" y="28" width="20" height="12" rx="3"/>
        <rect x="150" y="6"  width="20" height="34" rx="3"/>
        <rect x="198" y="18" width="20" height="22" rx="3"/>
        <rect x="246" y="2"  width="20" height="38" rx="3"/>
      </g>
      <g fill="#7A8A99" font-size="8" text-anchor="middle">
        <text x="16" y="52">Dec</text>
        <text x="64" y="52">Jan</text>
        <text x="112" y="52">Feb</text>
        <text x="160" y="52">Mar</text>
        <text x="208" y="52">Apr</text>
        <text x="256" y="52">May</text>
      </g>
    </g>
  </g>

  <!-- filters -->
  <g transform="translate(16 328)" font-size="10" font-weight="600">
    <g><rect width="64" height="28" rx="14" fill="#1976D2"/><text x="32" y="18" text-anchor="middle" fill="#ffffff">All</text></g>
    <g transform="translate(72 0)"><rect width="64" height="28" rx="14" fill="#ffffff" stroke="#E3E8EF"/><text x="32" y="18" text-anchor="middle" fill="#0F2742">Labs</text></g>
    <g transform="translate(144 0)"><rect width="74" height="28" rx="14" fill="#ffffff" stroke="#E3E8EF"/><text x="37" y="18" text-anchor="middle" fill="#0F2742">Doctors</text></g>
    <g transform="translate(226 0)"><rect width="86" height="28" rx="14" fill="#ffffff" stroke="#E3E8EF"/><text x="43" y="18" text-anchor="middle" fill="#0F2742">Ambulance</text></g>
